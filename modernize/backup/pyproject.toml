[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backuptool"
version = "0.1.0"
description = "A modern, extensible Linux folder backup CLI"
authors = [
  { name = "Gill98bee" }
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GNU General Public License v3.0" }

[project.optional-dependencies]
cli = ["typer[all] >=0.9", "rich >= 13.0"]
storage = ["boto3 >=1.28", "paramiko >=3.0"]
crypto = ["cryptography >=40.0"]
test = ["pytest >=7.0"]

[tool.black]
line-length = 88
